org.gradle.jvmargs=-Xmx4G -Dorg.gradle.internal.http.connectionTimeout=20000 -Dorg.gradle.internal.http.socketTimeout=20000 -Dorg.gradle.internal.repository.max.tentatives=2
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 项目位于中文目录（E:\情感开发）；Flutter 侧无 NDK 原生代码，允许 AGP 跳过非 ASCII 路径检查
android.overridePathCheck=true
# Kotlin 增量编译缓存在中文路径下无法正确关闭（class-fq-name-to-source.tab 等），关掉增量编译
kotlin.incremental=false
kotlin.incremental.java=false
# 沙箱环境禁止写入 C:\Users\admin\AppData\Local\kotlin\daemon；改为在 Gradle 进程内编译
kotlin.compiler.execution.strategy=in-process
