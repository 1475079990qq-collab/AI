name: companion_client
description: "companion 安卓客户端：键盘文本对话 + SSE 流式解析 + TTS 播放"
publish_to: 'none'
version: 1.3.1+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  just_audio: ^0.9.36
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

# 中文项目路径下 CMake 会失败（jni 包的原生库），把这两个 Android 实现固定在
# 不依赖 jni 的版本；功能接口不变。
dependency_overrides:
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true
