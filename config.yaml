# companion 启动配置
# 唯一来源原则：同一件事只允许写在一个地方。
#   本文件 = 进程怎么启动、连到哪 -> 启动读一次，改完要重启
#   数据库（控制台） = 人格、称呼、模型卡地址与型号、温度、音色 -> 改完立即生效
#
# 历史教训：模型地址曾经同时写在 config.yaml 和数据库模型卡里，两边还不一致，
# 结果「改了不生效」查了半天。现在模型服务只在控制台里改，本文件只做兜底。
#
# 左边是配置项名字别动，只改冒号右边的值。

# ---- 服务 ----
服务:
  BRAIN_HOST: 0.0.0.0            # 0.0.0.0 = 手机局域网也能连；只想本机用改 127.0.0.1
  BRAIN_PORT: 8000
  CONSOLE_PORT: 8000             # 控制台已并入大脑进程，必须与 BRAIN_PORT 相同
  ADMIN_TOKEN:                   # 留空 = 管理接口只允许本机/内网来源访问

# ---- 数据 ----
数据:
  DB_PATH: data/companion.db
  CHROMA_PATH: data/chroma

# ---- 兜底值（仅在数据库里没有对应模型卡时才生效，正常不用碰）----
兜底:
  OLLAMA_BASE: http://127.0.0.1:11434
  LLM_MODEL: qwen3:8b
  JUDGE_PORT: 8101
  ASR_PORT: 8103
  TTS_PORT: 8102
  TTS_BACKEND: gpt_sovits
  TTS_SOVITS_URL: http://127.0.0.1:9880
  ASR_LANGUAGE: auto
  ASR_MAX_SECONDS: 60
