<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思考现场 · 神经联络</title>
<style>
  :root {
    --bg: #0b0f11;
    --panel: #11171a;
    --line: rgba(255, 255, 255, .10);
    --ink: #e6ece9;
    --muted: #8b979b;
    --accent: #5fd0b4;
    --warm: #e8a67a;
    --cool: #7aa8e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 22px 26px 34px; }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 20px; letter-spacing: .5px; font-weight: 650; }
  .head .sub { color: var(--muted); font-size: 12.5px; }
  .head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .pill {
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
    background: rgba(255,255,255,.02);
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6b7478; }
  .dot.on { background: var(--accent); box-shadow: 0 0 10px rgba(95,208,180,.8); }
  .dot.err { background: #e07a72; box-shadow: 0 0 10px rgba(224,122,114,.7); }
  a.back { color: var(--muted); text-decoration: none; font-size: 12.5px; }
  a.back:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; margin-top: 18px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  .stage { position: relative; }
  #atlas { display: block; width: 100%; height: min(76vh, 820px); }
  .legend { padding: 14px 16px 18px; }
  .legend .t { font-size: 12px; letter-spacing: .6px; color: var(--muted); text-transform: uppercase; }
  .row {
    display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: start;
    padding: 9px 0; border-bottom: 1px dashed rgba(255,255,255,.07);
  }
  .row:last-child { border-bottom: 0; }
  .row .sw { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; }
  .row .nm { font-size: 12.5px; }
  .row .val { font-size: 11.5px; color: var(--muted); text-align: right; max-width: 130px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row.idle .nm { color: #6e797d; }
  .where { margin-top: 12px; font-size: 11.5px; color: #6e797d; line-height: 1.7; }
  .where code { color: #93a0a4; }

  .feed { margin-top: 18px; padding: 12px 16px 14px; font-size: 12px; color: var(--muted); }
  .feed .line { padding: 4px 0; font-variant-numeric: tabular-nums; }
  .feed .k { color: #93a0a4; display: inline-block; min-width: 78px; }
  .feed .line b { color: var(--ink); font-weight: 600; }
  .foot { margin-top: 16px; color: #5f696d; font-size: 11.5px; line-height: 1.75; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>思考现场</h1>
    <span class="sub">每条脉冲 = 大脑这一次真实走过的一站；不抖假数据</span>
    <div class="right">
      <span class="pill"><span class="dot" id="conn-dot"></span> <span id="conn-txt">连接中…</span></span>
      <span class="pill">本轮 <b id="turn-ms">—</b></span>
      <span class="pill">事件 <b id="ev-count">0</b></span>
      <a class="back" href="admin.html">← 回控制台</a>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="panel legend" id="legend">
        <div class="t">九站 · 真实阶段</div>
        <div id="legend-rows"></div>
        <div class="where">
          数据源 <code>/api/admin/live/stream</code>（SSE）。<br>
          断线自动重连；15 秒无事件只发心跳。
        </div>
      </div>
      <div class="panel feed">
        <div class="t" style="font-size:11.5px;letter-spacing:.6px;color:#8b979b">最近事件</div>
        <div id="feed-lines"></div>
      </div>
    </div>
    <div class="panel stage">
      <canvas id="atlas"></canvas>
    </div>
  </div>

  <div class="foot">
    位置 = 固定编组（输入 → 判断 → 记忆 → 提示词 → 工具 → 思考 → 出字 → 声音 → 收尾），不随数据乱跑。<br>
    节点亮度与余晖来自事件时刻与耗时；旁边的细点是该站最近通过的次数，亮一颗代表真的又过一次。
  </div>
</div>
<script src="brain.js"></script>
</body>
</html>
